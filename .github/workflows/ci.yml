name: CI - Simple Stock Flow Automated Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Unit Tests (PHP 8.2 + Laravel 11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath
          coverage: none

      - name: Install Composer Dependencies
        working-directory: api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit Test Suite
        working-directory: api
        run: vendor/bin/phpunit --configuration phpunit.xml

  frontend-tests:
    name: Frontend Build & Unit Tests (React 18 + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        working-directory: app
        run: npm ci || npm install

      - name: Run Unit Tests
        working-directory: app
        run: npm test

      - name: Build Production Assets
        working-directory: app
        run: npm run build

  tool-tests:
    name: Seeder CLI Tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: tool
        run: pip install -r requirements.txt

      - name: Run Unit Tests
        working-directory: tool
        run: python -m unittest discover tests/
